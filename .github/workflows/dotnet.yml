# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
  deploy_job:
    runs-on: ubuntu-latest
    name: deploy
    steps:
        - name: Deploy file 93
          uses: wlixcc/SFTP-Deploy-Action@v1.2.4
          with:
            username: www_deploy
            server: 82.165.217.93
            port: 22
            # local_path: './*'
            local_path: '/home/runner/work/p26pre/p26pre/bin/Debug/net9.0/linux-x64/*'
            # local_path: './bin/Release/net9.0/linux-x64/publish'
            remote_path: '/var/socka'
            sftp_only: true
            password: ${{secrets.FTP_PASS}}
            
